openapi: 3.0.3
info:
  title: ftree BFF API
  version: 0.2.0
  description: API contract for the ftree UI and Backend for Frontend.
servers:
  - url: http://localhost:8080
    description: Local BFF
tags:
  - name: Families
    description: Isolated family trees and test sets
  - name: Members
    description: People in the family tree
paths:
  /members:
    get:
      operationId: getMembers
      tags:
        - Members
      summary: List members in the default family
      description: Returns members from the default family for backwards compatibility.
      responses:
        "200":
          description: Members in the default family, possibly empty.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
    post:
      operationId: createMember
      tags:
        - Members
      summary: Create a member in the default family
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMemberRequest"
      responses:
        "201":
          description: Member created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          description: The request is invalid.
  /members/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: updateMember
      tags:
        - Members
      summary: Update a member in the default family
      description: Replaces the member's fields. Parents and children stay unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMemberRequest"
      responses:
        "200":
          description: Member updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          description: The request is invalid.
        "404":
          description: Member not found.
    delete:
      operationId: deleteMember
      tags:
        - Members
      summary: Delete a member in the default family
      responses:
        "204":
          description: Member deleted.
        "404":
          description: Member not found.
  /members/{id}/relatives:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: updateMemberRelatives
      tags:
        - Members
      summary: Replace relatives of a member in the default family
      description: >-
        Replaces all three sets, and the siblings when they are sent. Partnerships are mutual.
        Siblings are not stored but derived from shared parents. Rejects unknown members, the
        member itself, a member in more than one set, siblings sharing no or other parents, and
        links that would make someone their own ancestor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Relatives"
      responses:
        "204":
          description: Relatives updated.
        "400":
          description: The relatives are invalid.
        "404":
          description: Member not found.
  /families:
    get:
      operationId: getFamilies
      tags:
        - Families
      summary: List family sets
      responses:
        "200":
          description: Family sets ordered by creation time.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FamilySummary"
    post:
      operationId: createFamily
      tags:
        - Families
      summary: Create a generated family set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFamilyRequest"
      responses:
        "201":
          description: Family and generated members created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilySummary"
        "400":
          description: The name or generation settings are invalid or infeasible.
        "409":
          description: A family with this name already exists.
  /families/{familyId}:
    parameters:
      - name: familyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteFamily
      tags:
        - Families
      summary: Delete a family and all of its members
      description: Any family, including the default family, can be deleted.
      responses:
        "204":
          description: Family and its members deleted.
        "404":
          description: Family not found.
  /families/{familyId}/archive:
    parameters:
      - name: familyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: archiveFamily
      tags:
        - Families
      summary: Move all members of a family into a new named family
      description: The source family stays and is empty afterwards, so the default family can be filled again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveFamilyRequest"
      responses:
        "201":
          description: Archived family with the moved members, links, and placements.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilySummary"
        "400":
          description: The name is invalid or the family has no members.
        "404":
          description: Family not found.
        "409":
          description: A family with this name already exists.
  /families/{familyId}/members:
    parameters:
      - name: familyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getFamilyMembers
      tags:
        - Members
      summary: List members in a family
      responses:
        "200":
          description: Members in this family, possibly empty.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
        "404":
          description: Family not found.
    post:
      operationId: createFamilyMember
      tags:
        - Members
      summary: Create a member in a family
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMemberRequest"
      responses:
        "201":
          description: Member created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          description: The request is invalid.
        "404":
          description: Family not found.
  /families/{familyId}/members/{id}:
    parameters:
      - name: familyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: updateFamilyMember
      tags:
        - Members
      summary: Update a member in a family
      description: Replaces the member's fields. Parents and children stay unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMemberRequest"
      responses:
        "200":
          description: Member updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          description: The request is invalid.
        "404":
          description: Member not found.
    delete:
      operationId: deleteFamilyMember
      tags:
        - Members
      summary: Delete a member in a family
      responses:
        "204":
          description: Member deleted.
        "404":
          description: Member not found.
  /families/{familyId}/members/{id}/relatives:
    parameters:
      - name: familyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: updateFamilyMemberRelatives
      tags:
        - Members
      summary: Replace a family member's parents, children, partners, and siblings
      description: >-
        Replaces all three sets, and the siblings when they are sent. Partnerships are mutual,
        so the partners list this member too. Siblings are not stored but derived from shared
        parents: each listed sibling gets exactly the given parents of this member, and other
        members outside these sets lose the parents they share with this member. Rejects unknown members,
        the member itself, a member in more than one set, siblings sharing no or other parents,
        and links that would make someone their own ancestor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Relatives"
      responses:
        "204":
          description: Relatives updated.
        "400":
          description: The relatives are invalid.
        "404":
          description: Member not found.
  /families/{familyId}/members/{id}/placement:
    parameters:
      - name: familyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: updateFamilyMemberPlacement
      tags:
        - Members
      summary: Pin a member's card to a branch point or place it freely
      description: >-
        Exactly one of pinId and position must be set. Setting one clears the other, so a
        previous pin becomes free. A pin holds at most one card.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Placement"
      responses:
        "204":
          description: Placement updated.
        "400":
          description: Neither or both of pinId and position are set.
        "404":
          description: Member not found.
        "409":
          description: Another member's card already hangs on this pin.
components:
  schemas:
    FamilySummary:
      type: object
      required:
        - id
        - name
        - memberCount
        - childCount
        - generationCount
        - testSettings
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 100
        memberCount:
          type: integer
          minimum: 0
        childCount:
          type: integer
          minimum: 0
        generationCount:
          type: integer
          minimum: 0
        testSettings:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/TestFamilySettings"
    TestFamilySettings:
      type: object
      required:
        - totalUsers
        - generationCount
        - minChildren
        - maxChildren
      properties:
        totalUsers:
          type: integer
          minimum: 1
          maximum: 250
        generationCount:
          type: integer
          minimum: 1
          maximum: 10
        minChildren:
          type: integer
          minimum: 0
          maximum: 3
        maxChildren:
          type: integer
          minimum: 0
          maximum: 3
    CreateFamilyRequest:
      type: object
      required:
        - name
        - totalUsers
        - generationCount
        - minChildren
        - maxChildren
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        totalUsers:
          type: integer
          minimum: 1
          maximum: 250
        generationCount:
          type: integer
          minimum: 1
          maximum: 10
        minChildren:
          type: integer
          minimum: 0
          maximum: 3
        maxChildren:
          type: integer
          minimum: 0
          maximum: 3
    ArchiveFamilyRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    Member:
      type: object
      required:
        - id
        - firstName
        - lastName
        - parentIds
        - partnerIds
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        birthDate:
          type: string
          format: date
          nullable: true
        birthPlace:
          type: string
          maxLength: 200
          nullable: true
        deathDate:
          type: string
          format: date
          nullable: true
        deathPlace:
          type: string
          maxLength: 200
          nullable: true
        note:
          type: string
          maxLength: 5000
          nullable: true
        photoUrl:
          type: string
          format: uri
          nullable: true
        parentIds:
          description: Ids of this member's parents. Children are the members listing this id.
          type: array
          items:
            type: string
            format: uuid
        partnerIds:
          description: Ids of this member's partners, current or former. Always mutual.
          type: array
          items:
            type: string
            format: uuid
        pinId:
          description: Branch point the card hangs from; null when placed freely or not yet placed.
          type: integer
          minimum: 0
          nullable: true
        position:
          description: Free card position relative to the tree base; null when pinned or not yet placed.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Position"
    Position:
      type: object
      required:
        - x
        - y
        - z
      properties:
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        z:
          type: number
          format: double
    Placement:
      type: object
      properties:
        pinId:
          type: integer
          minimum: 0
          nullable: true
        position:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Position"
    Relatives:
      type: object
      required:
        - parentIds
        - childIds
        - partnerIds
      properties:
        parentIds:
          type: array
          items:
            type: string
            format: uuid
        childIds:
          type: array
          items:
            type: string
            format: uuid
        partnerIds:
          type: array
          items:
            type: string
            format: uuid
        siblings:
          description: >-
            Replaces the members sharing parents with this member; when absent, siblings stay unchanged.
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/Sibling"
    Sibling:
      type: object
      required:
        - id
        - parentIds
      properties:
        id:
          type: string
          format: uuid
        parentIds:
          description: >-
            The parents shared with this member: all of them for a sibling, some for a half-sibling.
          type: array
          items:
            type: string
            format: uuid
    CreateMemberRequest:
      type: object
      required:
        - firstName
        - lastName
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        birthDate:
          type: string
          format: date
          nullable: true
        birthPlace:
          type: string
          maxLength: 200
          nullable: true
        deathDate:
          type: string
          format: date
          nullable: true
        deathPlace:
          type: string
          maxLength: 200
          nullable: true
        note:
          type: string
          maxLength: 5000
          nullable: true
        photoUrl:
          type: string
          format: uri
          nullable: true
