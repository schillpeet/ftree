openapi: 3.0.3
info:
  title: ftree BFF API
  version: 1.0.0
  description: API contract for the ftree UI and Backend for Frontend.
servers:
  - url: http://localhost:8080
    description: Local BFF
    x-internal: true
security:
  - cloudflareAccess: []
tags:
  - name: Families
    description: Isolated family trees and test sets
  - name: Members
    description: People in the family tree
  - name: Me
    description: The signed-in user and their permissions
  - name: Users
    description: Who may sign in and who has signed in
  - name: Live
    description: Who is in a family tree right now and what others change in it
  - name: admin
    description: Read-only overviews across all trees and people, for admins
  - name: Trash
    description: Deleted families, kept for 30 days before they are removed for good
paths:
  /me:
    get:
      operationId: getMe
      tags:
        - Me
      summary: Get the signed-in user
      description: Returns the caller's email, whether they are an admin or may create trees, and their permissions outside any family; each family in `GET /families` carries the caller's role and permissions in it.
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /users:
    get:
      operationId: getUsers
      tags:
        - Users
      summary: List sign-ins
      description: Lists the bootstrap admins (from the access file or `app.roles.admins`) in their order, then everyone else the database gives a right (admin, creating trees, or a role in a tree) by email, each with when they first and last signed in, followed by anyone who signed in without being listed, most recent first. Sign-ins are recorded at most every few minutes per person. Needs `users.view`, which only admins have.
      responses:
        "200":
          description: The listed and signed-in users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserLogin"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  # Administration: read-only overviews across all trees, for admins.
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags:
        - admin
      summary: Count trees, people, photos, and who is online
      description: Needs `users.view`, which only admins have. Online people come from the BFF's memory, so they are accurate only while the BFF runs as a single replica.
      responses:
        "200":
          description: The totals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/presence:
    get:
      operationId: getAdminPresence
      tags:
        - admin
      summary: List everyone present in any tree
      description: One entry per browser tab, sorted by email and tab, with the tree and member each views or edits. Needs `users.view`.
      responses:
        "200":
          description: Everyone present right now; empty when nobody is.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminPresence"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/families:
    get:
      operationId: getAdminFamilies
      tags:
        - admin
      summary: List every family with its owners and size
      description: Includes test families and families the caller has no role in, in the saved order. Needs `users.view`.
      responses:
        "200":
          description: Every family.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminFamily"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  # Trash: deleted families, admin only.
  /admin/trash:
    get:
      operationId: getTrash
      tags:
        - Trash
      summary: List the trashed families
      description: Lists the families in the trash, the one deleted longest ago first. `DELETE /families/{familyId}` moves a family here instead of deleting it; it disappears for everyone else, admins included, and keeps its name and slug. The BFF removes it for good at `purgeAt`, 30 days after it was deleted. Needs `family.manage`, which only admins have.
      responses:
        "200":
          description: The trashed families.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrashedFamily"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/trash/{familyId}:
    parameters:
      - name: familyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: purgeTrashedFamily
      tags:
        - Trash
      summary: Delete a trashed family for good
      description: Removes the trashed family with its members, links, and photos right away; this cannot be undone. Needs `family.manage`.
      responses:
        "204":
          description: Family removed for good.
        "404":
          description: No trashed family with this id. Code `NOT_FOUND`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/trash/{familyId}/restore:
    parameters:
      - name: familyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: restoreTrashedFamily
      tags:
        - Trash
      summary: Restore a trashed family
      description: Takes the family out of the trash with everything it had, memberships included. Needs `family.manage`.
      responses:
        "204":
          description: Family restored.
        "404":
          description: No trashed family with this id. Code `NOT_FOUND`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /families:
    get:
      operationId: getFamilies
      tags:
        - Families
      summary: List family sets
      responses:
        "200":
          description: Family sets in their saved order; new families are appended.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FamilySummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createFamily
      tags:
        - Families
      summary: Create a generated family set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFamilyRequest"
      responses:
        "201":
          description: Family and generated members created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilySummary"
        "400":
          description: The name or generation settings are invalid or infeasible. Code `INVALID_REQUEST`, or `VALIDATION_FAILED` for a body that breaks the schema.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: A family with this name already exists. Code `NAME_TAKEN`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /families/order:
    put:
      operationId: reorderFamilies
      tags:
        - Families
      summary: Save the order of all families
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderFamiliesRequest"
      responses:
        "204":
          description: Order saved.
        "400":
          description: The list does not contain every family exactly once. Code `INVALID_REQUEST`, or `VALIDATION_FAILED` for a body that breaks the schema.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /families/{familyId}:
    parameters:
      - name: familyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteFamily
      tags:
        - Families
      summary: Move a family to the trash
      description: Any family, including the default family, can be deleted. The family and its members move to the trash for 30 days (see the Trash tag), where only admins can restore or remove them; until then its name and slug stay taken.
      responses:
        "204":
          description: Family moved to the trash.
        "404":
          description: Family not found. Code `NOT_FOUND`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: renameFamily
      tags:
        - Families
      summary: Rename a family
      description: Renames the family without touching its members, links, or placements.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameFamilyRequest"
      responses:
        "200":
          description: Family renamed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilySummary"
        "400":
          description: The name is invalid. Code `INVALID_REQUEST`, or `VALIDATION_FAILED` for a body that breaks the schema.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Family not found. Code `NOT_FOUND`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: A family with this name already exists. Code `NAME_TAKEN`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /families/{familyId}/archive:
    parameters:
      - name: familyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: archiveFamily
      tags:
        - Families
      summary: Move all members of a family into a new named family
      description: The source family stays and is empty afterwards, so the default family can be filled again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveFamilyRequest"
      responses:
        "201":
          description: Archived family with the moved members, links, and placements.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilySummary"
        "400":
          description: The name is invalid or the family has no members. Code `INVALID_REQUEST`, or `VALIDATION_FAILED` for a body that breaks the schema.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Family not found. Code `NOT_FOUND`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: A family with this name already exists. Code `NAME_TAKEN`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /families/{familyId}/anonymize:
    parameters:
      - name: familyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: anonymizeFamily
      tags:
        - Families
      summary: Copy a family under a new name with random member names
      description: >-
        Copies every member with dates, places, notes, parent/child and partner links, partnership
        details, and placement into a new family. First, last, and birth names are replaced with
        random ones; a last name maps to the same random name throughout the copy. Photos are not
        copied. The source family is not changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnonymizeFamilyRequest"
      responses:
        "201":
          description: Anonymized copy created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilySummary"
        "400":
          description: The name is invalid. Code `INVALID_REQUEST`, or `VALIDATION_FAILED` for a body that breaks the schema.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Family not found. Code `NOT_FOUND`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: A family with this name already exists. Code `NAME_TAKEN`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /families/empty:
    post:
      operationId: createEmptyFamily
      tags:
        - Families
      summary: Create an empty named family
      description: >-
        Creates a family without members or test settings; the members are added to it one by one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmptyFamilyRequest"
      responses:
        "201":
          description: Empty family created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilySummary"
        "400":
          description: The name is invalid. Code `INVALID_REQUEST`, or `VALIDATION_FAILED` for a body that breaks the schema.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: A family with this name already exists. Code `NAME_TAKEN`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /families/import:
    post:
      operationId: importFamily
      tags:
        - Families
      summary: Import a GEDCOM file as a new named family
      description: >-
        Reads people (name, birth, death, notes) and families (partners and children) from a
        GEDCOM 5.5.1 or 7 file. Dates that are not exact days are kept verbatim in the note.
        Photos and card placement are not imported.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportFamilyRequest"
      responses:
        "201":
          description: Family and imported members created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilySummary"
        "400":
          description: >-
            The name is invalid, the file cannot be read, someone would be their own ancestor,
            or it contains more than 2000 people. Code `INVALID_REQUEST`, or `VALIDATION_FAILED` for a body that breaks the schema.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: A family with this name already exists. Code `NAME_TAKEN`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /families/{familyId}/export:
    parameters:
      - name: familyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: exportFamily
      tags:
        - Families
      summary: Export a family as a GEDCOM 5.5.1 file
      description: Photos and card placement are not exported.
      responses:
        "200":
          description: GEDCOM file, sent as an attachment named after the family.
          content:
            text/plain; charset=utf-8:
              schema:
                type: string
        "404":
          description: Family not found. Code `NOT_FOUND`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /families/{familyId}/photo:
    parameters:
      - name: familyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getFamilyPhoto
      tags:
        - Families
      summary: Get a family's uploaded photo
      description: Cached for a year; clients add photoUpdatedAt to the URL so a new photo gets a new URL.
      responses:
        "200":
          description: The photo with its stored content type.
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, max-age=31536000
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: Family or photo not found. Code `NOT_FOUND`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: uploadFamilyPhoto
      tags:
        - Families
      summary: Upload or replace a family's photo
      description: The raw image bytes, at most 2 MB, as JPEG, PNG, or WebP.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Photo stored.
        "400":
          description: The body is empty. Code `INVALID_REQUEST`, or `VALIDATION_FAILED` for a body that breaks the schema.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Family not found. Code `NOT_FOUND`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: The photo is larger than 2 MB. Code `PHOTO_TOO_LARGE`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: The content type is not JPEG, PNG, or WebP. Code `UNSUPPORTED_MEDIA_TYPE`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteFamilyPhoto
      tags:
        - Families
      summary: Remove a family's uploaded photo
      responses:
        "204":
          description: Photo removed.
        "404":
          description: Family or photo not found. Code `NOT_FOUND`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /families/{familyId}/photo-fit:
    parameters:
      - name: familyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: setFamilyPhotoFit
      tags:
        - Families
      summary: Set how a family's photo is shown
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetFamilyPhotoFitRequest"
      responses:
        "200":
          description: Photo fit stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FamilySummary"
        "400":
          description: The photo fit is missing or unknown. Code `INVALID_REQUEST`, or `VALIDATION_FAILED` for a body that breaks the schema.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Family not found. Code `NOT_FOUND`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /families/{familyId}/members:
    parameters:
      - name: familyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getFamilyMembers
      tags:
        - Members
      summary: List members in a family
      responses:
        "200":
          description: Members in this family, possibly empty.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
        "404":
          description: Family not found. Code `NOT_FOUND`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createFamilyMember
      tags:
        - Members
      summary: Create a member in a family
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMemberRequest"
      responses:
        "201":
          description: Member created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          description: The request is invalid. Code `INVALID_REQUEST`, or `VALIDATION_FAILED` for a body that breaks the schema.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Family not found. Code `NOT_FOUND`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /families/{familyId}/members/{id}:
    parameters:
      - name: familyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: updateFamilyMember
      tags:
        - Members
      summary: Update a member in a family
      description: >-
        Replaces the member's fields. Parents and children stay unchanged. With a version, the update is rejected when
        the member changed since that version was read; without one, it overwrites whatever is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRequest"
      responses:
        "200":
          description: Member updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          description: The request is invalid. Code `INVALID_REQUEST`, or `VALIDATION_FAILED` for a body that breaks the schema.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Member not found. Code `NOT_FOUND`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          $ref: "#/components/responses/EditConflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteFamilyMember
      tags:
        - Members
      summary: Delete a member in a family
      responses:
        "204":
          description: Member deleted.
        "404":
          description: Member not found. Code `NOT_FOUND`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /families/{familyId}/members/{id}/relatives:
    parameters:
      - name: familyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: updateFamilyMemberRelatives
      tags:
        - Members
      summary: Replace a family member's parents, children, partners, and siblings
      description: >-
        Replaces all three sets, and the siblings when they are sent. Partnerships are mutual,
        so the partners list this member too. Parent links carry a kind (biological, adoptive, step,
        or foster); parents without one are biological, and when parentLinks is absent, stored kinds
        stay unchanged. Siblings are not stored but derived from shared
        parents: each listed sibling gets exactly the given parents of this member, and other
        members outside these sets lose the parents they share with this member. Rejects unknown members,
        the member itself, a member in more than one set, siblings sharing no or other parents,
        and links that would make someone their own ancestor. With a version, the change is rejected when the member
        changed since that version was read. The change raises the version of every member whose own parent, child, or
        partner links it adds, removes, or alters, including this member; derived siblings do not count.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Relatives"
      responses:
        "204":
          description: Relatives updated.
        "400":
          description: The relatives are invalid. Code `INVALID_REQUEST`, or `VALIDATION_FAILED` for a body that breaks the schema.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Member not found. Code `NOT_FOUND`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          $ref: "#/components/responses/EditConflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /families/{familyId}/members/{id}/placement:
    parameters:
      - name: familyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: updateFamilyMemberPlacement
      tags:
        - Members
      summary: Pin a member's card to a branch point or place it freely
      description: >-
        Exactly one of pinId and position must be set. Setting one clears the other, so a
        previous pin becomes free. A pin holds at most one card.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Placement"
      responses:
        "204":
          description: Placement updated.
        "400":
          description: Neither or both of pinId and position are set. Code `INVALID_REQUEST`, or `VALIDATION_FAILED` for a body that breaks the schema.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Member not found. Code `NOT_FOUND`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Another member's card already hangs on this pin. Code `PIN_TAKEN`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /families/{familyId}/members/{id}/photo:
    parameters:
      - name: familyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getFamilyMemberPhoto
      tags:
        - Members
      summary: Get a member's uploaded photo
      description: Cached for a year; clients add photoUpdatedAt to the URL so a new photo gets a new URL.
      responses:
        "200":
          description: The photo with its stored content type.
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, max-age=31536000
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: Member or photo not found. Code `NOT_FOUND`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: uploadFamilyMemberPhoto
      tags:
        - Members
      summary: Upload or replace a member's photo
      description: The raw image bytes, at most 2 MB, as JPEG, PNG, or WebP.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Photo stored.
        "400":
          description: The body is empty. Code `INVALID_REQUEST`, or `VALIDATION_FAILED` for a body that breaks the schema.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Member not found. Code `NOT_FOUND`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: The photo is larger than 2 MB. Code `PHOTO_TOO_LARGE`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: The content type is not JPEG, PNG, or WebP. Code `UNSUPPORTED_MEDIA_TYPE`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteFamilyMemberPhoto
      tags:
        - Members
      summary: Remove a member's uploaded photo
      responses:
        "204":
          description: Photo removed.
        "404":
          description: Member or photo not found. Code `NOT_FOUND`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  # Live: presence and change events of one family tree.
  /families/{familyId}/events:
    parameters:
      - name: familyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: streamFamilyEvents
      tags:
        - Live
      summary: Stream presence and changes in a family
      description: >-
        A server-sent event stream for `EventSource`; needs `tree.view` in the family.
        It starts with a `presence` event and sends one whenever someone arrives, leaves, or changes what they view, edit, or whether they are idle.
        After every saved change it sends `member-changed`, `member-deleted`, or `family-changed`, each naming who made it in `by`; the `data` of every event is one JSON object.
        A comment line every 20 seconds keeps proxies from closing the stream, and the server ends it after 30 minutes so `EventSource` reconnects with a fresh sign-in.
        Opening the stream adds the client to the family's presence like `PUT /families/{familyId}/presence`, and closing it removes the client.
        Presence lives in the memory of the single BFF replica.
      parameters:
        - name: clientId
          in: query
          required: true
          description: A random id the browser tab chooses once, the same it sends to `PUT /families/{familyId}/presence`.
          schema:
            $ref: "#/components/schemas/ClientId"
      responses:
        "200":
          description: >-
            The event stream; `Cache-Control: no-transform` keeps proxies, including the UI's `/api` rewrite, from compressing and buffering it.
            Events are `presence` (`PresenceEvent`), `member-changed` and `member-deleted` (`MemberEvent`), and `family-changed` (`FamilyEvent`).
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/EventStream"
        "400":
          description: The client id is missing or malformed. Code `VALIDATION_FAILED`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Family not found. Code `NOT_FOUND`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /families/{familyId}/presence:
    parameters:
      - name: familyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: updateFamilyPresence
      tags:
        - Live
      summary: Say what this client views or edits in a family
      description: >-
        Clients send it whenever their state changes and at least every 30 seconds; a client without either for 60 seconds leaves the presence.
        Needs `tree.view` in the family; every stream of the family then gets a new `presence` event if anything changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresenceUpdate"
      responses:
        "204":
          description: Presence updated.
        "400":
          description: The body breaks the schema (`VALIDATION_FAILED`), or `viewing` or `editing` names no member of this family (`INVALID_REQUEST`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Family not found. Code `NOT_FOUND`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    cloudflareAccess:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: >-
        The Cloudflare Access JWT that Cloudflare adds to every request after sign-in; browsers never send it themselves.
        The BFF checks its signature, expiry, issuer, and audience and takes the user from its `email` claim.
        The local dev mode needs no header.
  responses:
    Unauthorized:
      description: No valid sign-in. Code `UNAUTHENTICATED`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: >-
        Signed in, but the caller's role lacks the permission, or a browser write came from another site. Code `FORBIDDEN`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    EditConflict:
      description: >-
        Someone else saved the member since the sent version was read. Code `EDIT_CONFLICT`; reload the members to see
        the current state, then save again with its version, or without a version to overwrite it.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: An unexpected error on the server; the body names no internals. Code `INTERNAL_ERROR`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      description: An error as RFC 9457 problem details, sent as `application/problem+json`. Clients switch on `code`, never on `detail` or `title`.
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri
          description: A URN naming the kind of problem, `urn:ftree:problem:` followed by the code in kebab case.
          example: urn:ftree:problem:name-taken
        title:
          type: string
          description: The HTTP status phrase.
          example: Conflict
        status:
          type: integer
          description: The HTTP status code.
          example: 409
        detail:
          type: string
          description: A fixed English explanation for people; it never contains internals or the request's data.
          example: A family with this name already exists.
        instance:
          type: string
          format: uri-reference
          description: The path of the request that failed.
          example: /families
        code:
          $ref: "#/components/schemas/ProblemCode"
        errors:
          type: array
          description: The fields that broke the schema, only with `VALIDATION_FAILED`.
          items:
            $ref: "#/components/schemas/FieldError"
    ProblemCode:
      type: string
      description: |-
        What went wrong, for clients to act on:
        - `VALIDATION_FAILED` (400): the body or a parameter breaks the schema or is not readable JSON.
        - `INVALID_REQUEST` (400): the request is well-formed but not possible, for example an infeasible generation or a cycle of ancestors.
        - `UNAUTHENTICATED` (401): no valid sign-in.
        - `FORBIDDEN` (403): signed in, but not allowed.
        - `NOT_FOUND` (404): the family, member, or photo does not exist or is not visible.
        - `METHOD_NOT_ALLOWED` (405): the path does not support the method.
        - `NAME_TAKEN` (409): a family with this name already exists, possibly in the trash.
        - `PIN_TAKEN` (409): another member is already pinned to this place.
        - `EDIT_CONFLICT` (409): the member changed since the sent version was read.
        - `PHOTO_TOO_LARGE` (413): the photo is too large.
        - `UNSUPPORTED_MEDIA_TYPE` (415): the body's content type is not accepted.
        - `INTERNAL_ERROR` (500): an unexpected error on the server.
      enum:
        - VALIDATION_FAILED
        - INVALID_REQUEST
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - METHOD_NOT_ALLOWED
        - NAME_TAKEN
        - PIN_TAKEN
        - EDIT_CONFLICT
        - PHOTO_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - INTERNAL_ERROR
    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: The field's path in the body, for example `firstName`.
        message:
          type: string
          description: Why the value is not accepted.
    Me:
      type: object
      required:
        - email
        - admin
        - canCreateTrees
        - permissions
        - verified
      properties:
        email:
          type: string
          description: The email address the user signed in with.
        admin:
          type: boolean
          description: True for admins, who are admins in every family.
        canCreateTrees:
          type: boolean
          description: True for people who may create trees, becoming the owner of each tree they create; admins may always.
        permissions:
          type: array
          description: The permissions outside any family; admins have every permission.
          items:
            $ref: "#/components/schemas/Permission"
        verified:
          type: boolean
          description: True when Cloudflare Access confirmed the email; false in local dev mode.
    UserLogin:
      type: object
      required:
        - email
        - listed
        - firstSeen
        - lastSeen
      properties:
        email:
          type: string
          description: The email, trimmed and lowercased.
        listed:
          type: boolean
          description: True for a bootstrap admin (from the access file or `app.roles.admins`) or when the database gives the email a right.
        firstSeen:
          type: string
          format: date-time
          nullable: true
          description: The first recorded sign-in; null when the person has never signed in.
        lastSeen:
          type: string
          format: date-time
          nullable: true
          description: The latest recorded sign-in, accurate to a few minutes; null when the person has never signed in.
    AdminOverview:
      type: object
      required:
        - families
        - members
        - users
        - photos
        - online
        - seats
        - lastBackupAt
      properties:
        families:
          type: integer
          minimum: 0
          description: Trees, test families included.
        members:
          type: integer
          minimum: 0
        users:
          type: object
          required:
            - total
            - signedIn
            - invited
          properties:
            total:
              type: integer
              minimum: 0
              description: Everyone the access file or the database names, and everyone who signed in.
            signedIn:
              type: integer
              minimum: 0
            invited:
              type: integer
              minimum: 0
              description: Named, but never signed in.
        photos:
          type: object
          required:
            - count
            - bytes
          description: Family photos and member photos together.
          properties:
            count:
              type: integer
              minimum: 0
            bytes:
              type: integer
              format: int64
              minimum: 0
        online:
          type: integer
          minimum: 0
          description: Distinct people with at least one tab present in any tree.
        seats:
          type: object
          required:
            - used
            - limit
          properties:
            used:
              type: integer
              minimum: 0
              description: Distinct people who currently have access, that is admins, people who may create trees, and anyone with a role in a tree.
            limit:
              type: integer
              minimum: 0
        lastBackupAt:
          type: string
          format: date-time
          nullable: true
          description: Always null until backups are reported.
    AdminPresence:
      type: object
      required:
        - userId
        - email
        - displayName
        - admin
        - familyId
        - familySlug
        - familyName
        - viewing
        - editing
        - idle
        - since
      properties:
        userId:
          type: string
          format: uuid
          nullable: true
          description: Null when the person has no `users` row.
        email:
          type: string
        displayName:
          type: string
          description: The display name, or the part of the email before the `@`.
        admin:
          type: boolean
        familyId:
          type: string
          format: uuid
        familySlug:
          type: string
        familyName:
          type: string
        viewing:
          type: string
          format: uuid
          nullable: true
        editing:
          type: string
          format: uuid
          nullable: true
        idle:
          type: boolean
        since:
          type: string
          format: date-time
          description: When the tab arrived in the tree.
    AdminFamily:
      type: object
      required:
        - id
        - name
        - slug
        - createdBy
        - createdAt
        - test
        - memberCount
        - memberships
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        createdBy:
          type: string
          nullable: true
          description: The email of who created the family; null for families from before it was recorded.
        createdAt:
          type: string
          format: date-time
        test:
          type: boolean
          description: True for generated test families.
        memberCount:
          type: integer
          minimum: 0
        memberships:
          type: object
          required:
            - owner
            - editor
            - visitor
          description: How many people hold each role in the family. Admins hold none and are not counted.
          properties:
            owner:
              type: integer
              minimum: 0
            editor:
              type: integer
              minimum: 0
            visitor:
              type: integer
              minimum: 0
    Role:
      type: string
      description: A user's role in one family. Owners may also delete and share the family; every family has at least one.
      enum:
        - admin
        - owner
        - editor
        - visitor
    Permission:
      type: string
      enum:
        - tree.view
        - member.edit
        - family.edit
        - family.export
        - member.delete
        - family.delete
        - family.share
        - tree.appearance
        - family.create
        - family.manage
        - dev.tools
        - users.view
        - users.manage
    TrashedFamily:
      type: object
      required:
        - id
        - name
        - slug
        - deletedAt
        - deletedBy
        - purgeAt
        - memberCount
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        deletedAt:
          type: string
          format: date-time
        deletedBy:
          type: string
          nullable: true
          description: The email of whoever deleted the family, trimmed and lowercased; null when unknown.
        purgeAt:
          type: string
          format: date-time
          description: When the BFF removes the family for good.
        memberCount:
          type: integer
          minimum: 0
    FamilySummary:
      type: object
      required:
        - id
        - name
        - slug
        - memberCount
        - childCount
        - generationCount
        - testSettings
        - photoFit
        - role
        - permissions
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          description: Names the family in the access file; made from the name when the family is created and kept on rename.
          type: string
          maxLength: 60
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          readOnly: true
        memberCount:
          type: integer
          minimum: 0
        childCount:
          type: integer
          minimum: 0
        generationCount:
          type: integer
          minimum: 0
        testSettings:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/TestFamilySettings"
        photoUpdatedAt:
          description: When the uploaded family photo last changed; null when the family has none.
          type: string
          format: date-time
          nullable: true
          readOnly: true
        photoFit:
          $ref: "#/components/schemas/PhotoFit"
        role:
          $ref: "#/components/schemas/Role"
        permissions:
          type: array
          description: The caller's permissions in this family, from their role in it.
          readOnly: true
          items:
            $ref: "#/components/schemas/Permission"
    PhotoFit:
      description: >-
        "cover" fills the family card's title area; "original" shows the photo at its natural size,
        limited by the client.
      type: string
      enum:
        - cover
        - original
    SetFamilyPhotoFitRequest:
      type: object
      required:
        - photoFit
      properties:
        photoFit:
          $ref: "#/components/schemas/PhotoFit"
    TestFamilySettings:
      type: object
      required:
        - totalUsers
        - generationCount
        - minChildren
        - maxChildren
      properties:
        totalUsers:
          type: integer
          minimum: 1
          maximum: 250
        generationCount:
          type: integer
          minimum: 1
          maximum: 10
        minChildren:
          type: integer
          minimum: 0
          maximum: 3
        maxChildren:
          type: integer
          minimum: 0
          maximum: 3
    CreateFamilyRequest:
      type: object
      required:
        - name
        - totalUsers
        - generationCount
        - minChildren
        - maxChildren
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        totalUsers:
          type: integer
          minimum: 1
          maximum: 250
        generationCount:
          type: integer
          minimum: 1
          maximum: 10
        minChildren:
          type: integer
          minimum: 0
          maximum: 3
        maxChildren:
          type: integer
          minimum: 0
          maximum: 3
    CreateEmptyFamilyRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    ArchiveFamilyRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    AnonymizeFamilyRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    RenameFamilyRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    ReorderFamiliesRequest:
      type: object
      required:
        - familyIds
      properties:
        familyIds:
          type: array
          items:
            type: string
            format: uuid
    ImportFamilyRequest:
      type: object
      required:
        - name
        - gedcom
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        gedcom:
          description: Content of the GEDCOM file.
          type: string
          maxLength: 10000000
    Member:
      type: object
      required:
        - id
        - firstName
        - lastName
        - parentIds
        - parentLinks
        - partnerIds
        - partnerships
        - version
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        version:
          description: >-
            Raised whenever the member's fields or its own parent, child, or partner links change; moving its card
            or changing its photo leaves it alone. Send it back with an update to have it rejected if someone else saved first.
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        firstName:
          type: string
          minLength: 0
          maxLength: 100
        lastName:
          type: string
          minLength: 0
          maxLength: 100
        birthName:
          type: string
          maxLength: 100
          nullable: true
          description: Surname at birth, for example a maiden name that was given up.
        birthDate:
          type: string
          format: date
          nullable: true
        birthPlace:
          type: string
          maxLength: 200
          nullable: true
        deathDate:
          type: string
          format: date
          nullable: true
        deathPlace:
          type: string
          maxLength: 200
          nullable: true
        note:
          type: string
          maxLength: 5000
          nullable: true
        photoUrl:
          type: string
          format: uri
          nullable: true
        photoUpdatedAt:
          description: When the uploaded photo last changed; null when the member has none.
          type: string
          format: date-time
          nullable: true
          readOnly: true
        parentIds:
          description: Ids of this member's parents. Children are the members listing this id.
          type: array
          items:
            type: string
            format: uuid
        parentLinks:
          description: Kind per parent in parentIds.
          type: array
          readOnly: true
          items:
            $ref: "#/components/schemas/ParentLink"
        partnerIds:
          description: Ids of this member's partners, current or former. Always mutual.
          type: array
          items:
            type: string
            format: uuid
        partnerships:
          description: Status and dates per partner in partnerIds; the same on both sides.
          type: array
          readOnly: true
          items:
            $ref: "#/components/schemas/Partnership"
        pinId:
          description: Branch point the card hangs from; null when placed freely or not yet placed.
          type: integer
          minimum: 0
          nullable: true
        position:
          description: Free card position relative to the tree base; null when pinned or not yet placed.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Position"
    Position:
      type: object
      required:
        - x
        - y
        - z
      properties:
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        z:
          type: number
          format: double
    Placement:
      type: object
      properties:
        pinId:
          type: integer
          minimum: 0
          nullable: true
        position:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Position"
    Relatives:
      type: object
      required:
        - parentIds
        - childIds
        - partnerIds
      properties:
        version:
          description: The member's version the change is based on; when absent, the change applies whatever is stored.
          type: integer
          format: int64
          minimum: 0
          nullable: true
        parentIds:
          type: array
          items:
            type: string
            format: uuid
        parentLinks:
          description: >-
            Kinds of the parents in parentIds; parents left out are "biological", and when absent,
            existing kinds stay unchanged.
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ParentLink"
        childIds:
          type: array
          items:
            type: string
            format: uuid
        partnerIds:
          type: array
          items:
            type: string
            format: uuid
        siblings:
          description: >-
            Replaces the members sharing parents with this member; when absent, siblings stay unchanged.
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/Sibling"
        partnerships:
          description: >-
            Status and dates of partners in partnerIds, stored for both sides; partners left out are
            "together", and when absent, existing details stay unchanged.
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/Partnership"
    ParentLink:
      type: object
      required:
        - parentId
        - kind
      properties:
        parentId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - biological
            - adoptive
            - step
            - foster
    Partnership:
      type: object
      required:
        - partnerId
        - status
      properties:
        partnerId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - together
            - married
            - separated
            - divorced
            - widowed
        since:
          description: When the couple got together; only kept when the status is together.
          type: string
          format: date
          nullable: true
        marriedOn:
          description: Wedding date; only kept when the status is married, divorced, or widowed.
          type: string
          format: date
          nullable: true
        endedOn:
          description: >-
            When the couple separated or divorced, or the partner died; only kept when the status is separated,
            divorced, or widowed.
          type: string
          format: date
          nullable: true
    Sibling:
      type: object
      required:
        - id
        - parentIds
      properties:
        id:
          type: string
          format: uuid
        parentIds:
          description: >-
            The parents shared with this member: all of them for a sibling, some for a half-sibling.
          type: array
          items:
            type: string
            format: uuid
    CreateMemberRequest:
      type: object
      required:
        - firstName
        - lastName
      properties:
        firstName:
          type: string
          minLength: 0
          maxLength: 100
        lastName:
          type: string
          minLength: 0
          maxLength: 100
        birthName:
          type: string
          maxLength: 100
          nullable: true
          description: Surname at birth, for example a maiden name that was given up.
        birthDate:
          type: string
          format: date
          nullable: true
        birthPlace:
          type: string
          maxLength: 200
          nullable: true
        deathDate:
          type: string
          format: date
          nullable: true
        deathPlace:
          type: string
          maxLength: 200
          nullable: true
        note:
          type: string
          maxLength: 5000
          nullable: true
        photoUrl:
          type: string
          format: uri
          nullable: true
    # Live: presence and change events of one family tree.
    ClientId:
      type: string
      description: A random id of one browser tab, chosen by the client.
      minLength: 1
      maxLength: 64
      pattern: "^[A-Za-z0-9_-]+$"
    PresenceUpdate:
      type: object
      required:
        - clientId
        - idle
      properties:
        clientId:
          $ref: "#/components/schemas/ClientId"
        viewing:
          type: string
          format: uuid
          nullable: true
          description: The member whose profile the client shows, if any.
        editing:
          type: string
          format: uuid
          nullable: true
          description: The member the client edits, if any.
        idle:
          type: boolean
          description: Whether the tab is hidden or the user has been inactive for a while.
    PresentClient:
      type: object
      description: One browser tab in the family; a user with two tabs appears twice.
      required:
        - clientId
        - email
        - initials
        - admin
        - idle
      properties:
        clientId:
          $ref: "#/components/schemas/ClientId"
        email:
          type: string
          maxLength: 320
        initials:
          type: string
          maxLength: 2
          description: Up to two capital letters taken from the email's local part, for the avatar.
          example: MM
        admin:
          type: boolean
          description: Whether the user is an admin, who may be in any family.
        viewing:
          type: string
          format: uuid
          nullable: true
        editing:
          type: string
          format: uuid
          nullable: true
        idle:
          type: boolean
    PresenceEvent:
      type: object
      description: The data of a `presence` event, everyone in the family right now, sorted by email.
      required:
        - present
      properties:
        present:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/PresentClient"
    MemberEvent:
      type: object
      description: The data of a `member-changed` or `member-deleted` event; a change to a member's relatives may change the members it links as well.
      required:
        - memberId
        - by
      properties:
        memberId:
          type: string
          format: uuid
        by:
          type: string
          maxLength: 320
          description: The email of whoever saved the change.
    FamilyEvent:
      type: object
      description: >-
        The data of a `family-changed` event: the family's name, photo, or photo fit changed, its members were archived into another family, or it was deleted, after which the stream ends.
      required:
        - familyId
        - by
      properties:
        familyId:
          type: string
          format: uuid
        by:
          type: string
          maxLength: 320
          description: The email of whoever saved the change.
    EventStream:
      type: object
      description: >-
        A `text/event-stream` body; each event has an `event` name and one line of JSON `data` holding a `PresenceEvent`, `MemberEvent`, or `FamilyEvent`.
    UpdateMemberRequest:
      description: The fields of CreateMemberRequest plus the version the update is based on.
      type: object
      required:
        - firstName
        - lastName
      properties:
        firstName:
          type: string
          minLength: 0
          maxLength: 100
        lastName:
          type: string
          minLength: 0
          maxLength: 100
        birthName:
          type: string
          maxLength: 100
          nullable: true
          description: Surname at birth, for example a maiden name that was given up.
        birthDate:
          type: string
          format: date
          nullable: true
        birthPlace:
          type: string
          maxLength: 200
          nullable: true
        deathDate:
          type: string
          format: date
          nullable: true
        deathPlace:
          type: string
          maxLength: 200
          nullable: true
        note:
          type: string
          maxLength: 5000
          nullable: true
        photoUrl:
          type: string
          format: uri
          nullable: true
        version:
          description: The member's version the update is based on; when absent, the update overwrites whatever is stored.
          type: integer
          format: int64
          minimum: 0
          nullable: true
