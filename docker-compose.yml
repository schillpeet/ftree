services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  swagger:
    image: swaggerapi/swagger-ui:v5.33.1
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    ports:
      - "127.0.0.1:4010:8080"
    volumes:
      - ./api/openapi.yaml:/spec/openapi.yaml:ro

volumes:
  pgdata:
    name: ftree_postgres_data