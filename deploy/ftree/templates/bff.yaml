{{- /* Fail at render time, so Flux keeps the running release instead of rolling out a BFF that refuses to start. */}}
{{- if not (has .Values.bff.auth.mode (list "cloudflare" "dev")) }}
{{- fail (printf "bff.auth.mode must be cloudflare or dev, not %q" .Values.bff.auth.mode) }}
{{- end }}
{{- if eq .Values.bff.auth.mode "cloudflare" }}
{{- $_ := required "bff.auth.teamDomain is required in cloudflare mode" .Values.bff.auth.teamDomain }}
{{- $_ := required "bff.auth.audience is required in cloudflare mode" .Values.bff.auth.audience }}
{{- end }}
{{- if and .Values.bff.access (or .Values.bff.roles.admins .Values.bff.roles.editors) }}
{{- fail "set bff.access or bff.roles, not both; list the admins and editors in the access file" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels: {{- include "ftree.labels" (dict "ctx" . "component" "bff") | nindent 4 }}
  name: {{ include "ftree.fullname" . }}-bff
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "ftree.selectorLabels" (dict "ctx" . "component" "bff") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ftree.labels" (dict "ctx" . "component" "bff") | nindent 8 }}
      {{- with .Values.bff.access }}
      annotations:
        # The BFF reads the access file only at startup, so a changed file rolls the pod.
        checksum/access: {{ . | sha256sum }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: bff
          image: "{{ .Values.bff.image.repository }}:{{ .Values.bff.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.bff.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_URL
              value: {{ .Values.db.url | quote }}
            - name: DB_USER
              value: {{ .Values.db.user | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.existingSecret }}
                  key: password
            {{- with .Values.bff.corsAllowedOrigins }}
            # Unset, the BFF allows http://localhost:3000; an empty value would block every origin.
            - name: APP_CORS_ALLOWED_ORIGINS
              value: {{ . | quote }}
            {{- end }}
            - name: APP_AUTH_MODE
              value: {{ .Values.bff.auth.mode | quote }}
            {{- with .Values.bff.auth.teamDomain }}
            - name: APP_AUTH_TEAM_DOMAIN
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.bff.auth.audience }}
            - name: APP_AUTH_AUDIENCE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.bff.roles.admins }}
            - name: APP_ROLES_ADMINS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.bff.roles.editors }}
            - name: APP_ROLES_EDITORS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if .Values.bff.access }}
            - name: APP_ACCESS_FILE
              value: /config/access.yaml
            {{- end }}
          # The probes still only check that the port is open; the Actuator probes on the management port (8081) are not wired in yet.
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
          resources: {{- toYaml .Values.bff.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
          {{- if .Values.bff.access }}
          volumeMounts:
            - name: access
              mountPath: /config
              readOnly: true
          {{- end }}
      {{- if .Values.bff.access }}
      volumes:
        - name: access
          configMap:
            name: {{ include "ftree.fullname" . }}-bff-access
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  labels: {{- include "ftree.labels" (dict "ctx" . "component" "bff") | nindent 4 }}
  name: {{ include "ftree.fullname" . }}-bff
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector: {{- include "ftree.selectorLabels" (dict "ctx" . "component" "bff") | nindent 4 }}
