# GHCR packages are private until made public
imagePullSecrets: []
ui:
  image: { repository: ghcr.io/schillpeet/ftree-ui, tag: "", pullPolicy: IfNotPresent }
  resources:
    requests: { memory: 256Mi }
    limits: { memory: 256Mi }
bff:
  image: { repository: ghcr.io/schillpeet/ftree-bff, tag: "", pullPolicy: IfNotPresent }
  corsAllowedOrigins: ""
  auth:
    # cloudflare verifies the Cloudflare Access JWT; dev signs every request in as the unverified dev@localhost
    # (a visitor unless listed in roles) and is only for local clusters.
    mode: cloudflare
    # Access team domain, e.g. example.cloudflareaccess.com; required in cloudflare mode.
    teamDomain: ""
    # AUD tag of the Access application; required in cloudflare mode.
    audience: ""
  # The access file's content as one string, e.g. --set-file bff.access=access.yaml: every person with admin: true or
  # their role (editor or visitor) per family slug under trees. It replaces roles; set only one of the two.
  access: ""
  # Without access: emails per role, matched case-insensitively; everyone else Access lets in is a visitor in the first
  # family only.
  roles:
    admins: []
    editors: []
  resources:
    requests: { memory: 512Mi }
    limits: { memory: 512Mi }
db:
  url: "jdbc:postgresql://ftree-db:5432/appdb"
  user: "app"
  # Name of an existing Secret whose "password" key holds the database password.
  existingSecret: "ftree-db"