# GHCR packages are private until made public
imagePullSecrets: []
ui:
  image: { repository: ghcr.io/schillpeet/ftree-ui, tag: "", pullPolicy: IfNotPresent }
  resources:
    requests: { memory: 256Mi }
    limits: { memory: 256Mi }
bff:
  image: { repository: ghcr.io/schillpeet/ftree-bff, tag: "", pullPolicy: IfNotPresent }
  corsAllowedOrigins: ""
  auth:
    # cloudflare verifies the Cloudflare Access JWT; dev signs every request in as the unverified dev@localhost
    # (without any tree unless listed in roles.admins or given rights in the database) and is only for local clusters.
    mode: cloudflare
    # Access team domain, e.g. example.cloudflareaccess.com; required in cloudflare mode.
    teamDomain: ""
    # AUD tag of the Access application; required in cloudflare mode.
    audience: ""
  # The access file's content as one string, e.g. --set-file bff.access=access.yaml. Its admin: true entries are the
  # bootstrap admins; the BFF imports its other entries into the database once, which decides from then on. It replaces
  # roles; set only one of the two.
  access: ""
  # Without access: the bootstrap admins' emails, matched case-insensitively; everyone else gets their trees from the
  # database.
  roles:
    admins: []
  resources:
    requests: { memory: 512Mi }
    limits: { memory: 512Mi }
db:
  url: "jdbc:postgresql://ftree-db:5432/appdb"
  user: "app"
  # Name of an existing Secret whose "password" key holds the database password.
  existingSecret: "ftree-db"