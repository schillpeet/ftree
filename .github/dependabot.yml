version: 2
updates:
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(ui)"
      prefix-development: "build(ui)"

  - package-ecosystem: gradle
    directory: /bff
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(bff)"
    groups:
      # The Kotlin plugins share one compiler and must be on the same version.
      kotlin:
        patterns:
          - jvm
          - plugin.spring
          - plugin.jpa

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(repo)"
