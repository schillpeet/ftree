version: 2
updates:
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /bff
    schedule:
      interval: weekly
    groups:
      # The Kotlin plugins share one compiler and must be on the same version.
      kotlin:
        patterns:
          - jvm
          - plugin.spring
          - plugin.jpa
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
