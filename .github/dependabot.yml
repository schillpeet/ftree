version: 2
updates:
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(ui)"
      prefix-development: "deps(ui)"

  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(repo)"
      prefix-development: "deps(repo)"

  - package-ecosystem: gradle
    directory: /bff
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(bff)"
    groups:
      # The Kotlin plugins share one compiler and must be on the same version.
      kotlin:
        patterns:
          - jvm
          - plugin.spring
          - plugin.jpa

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(repo)"
    groups:
      # init and analyze must run the same CodeQL version, or the analyze post step fails.
      codeql-action:
        patterns:
          - github/codeql-action*
