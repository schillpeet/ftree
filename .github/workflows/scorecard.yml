name: Scorecard

# OpenSSF Scorecard rates the repository's supply-chain practices; the results go to code scanning and to the
# public badge in the README (publish_results). Branch protection is only partly visible without an admin token.
# It runs weekly and not on pushes: on a push it would race the push's own CI, CodeQL and Gradle wrapper runs, and count
# the commit as unscanned while they are still running (see docs/scorecard.md).
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    # Job permissions replace the top-level read-all instead of adding to it, so the read rights Scorecard needs are
    # listed here: without actions: read it cannot see the gradle-wrapper.yml runs and flags the wrapper jar.
    permissions:
      contents: read
      actions: read # find the successful Gradle wrapper validation for Binary-Artifacts
      security-events: write # upload to code scanning
      id-token: write # publish the results for the badge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: results.sarif
