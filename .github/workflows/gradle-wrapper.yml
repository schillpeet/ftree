name: Gradle wrapper

# Checks bff/gradle/wrapper/gradle-wrapper.jar against Gradle's published checksums on every commit, without the path
# filters of ci.yml: OpenSSF Scorecard's Binary-Artifacts check accepts the jar only when a successful validation run
# exists for the commit it scans, and this job finishes before Scorecard's own run on a push to main.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
