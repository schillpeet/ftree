name: BFF

# Runs only when files that affect the BFF change; Markdown-only changes are skipped.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - bff/**
      - api/openapi.yaml
      - .github/workflows/bff.yml
      - "!**.md"
  push:
    branches: [main]
    paths:
      - bff/**
      - api/openapi.yaml
      - .github/workflows/bff.yml
      - "!**.md"

permissions:
  contents: read

concurrency:
  group: bff-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bff
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d appdb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/appdb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags for the git-derived version
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
