name: Pin GitHub Actions

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/**

permissions:
  contents: read

jobs:
  pinact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lint GitHub Actions workflows
        run: actionlint .github/workflows/*.yml

      - name: Install pinact
        run: go install github.com/suzuki-shunsuke/pinact/v5/cmd/pinact@v5.0.0

      # Only checks, without a token that can push: pin new actions once locally with `pinact run`; Dependabot updates the SHAs.
      - name: Check GitHub Actions pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pinact run --check --verify-comment
