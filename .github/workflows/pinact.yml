name: Pin GitHub Actions

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/**

permissions:
  contents: read

jobs:
  pinact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lint GitHub Actions workflows
        run: actionlint .github/workflows/*.yml

      - name: Install pinact
        run: go install github.com/suzuki-shunsuke/pinact/v5/cmd/pinact@v5.0.0

      - name: Pin GitHub Actions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pinact run

      - name: Create pull request
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.PINACT_PUSH_TOKEN }}
          add-paths: .github/workflows/
          branch: pinact/update-action-shas
          base: main
          commit-message: "chore(deps): pin GitHub Actions commit SHAs"
          title: "chore(deps): pin GitHub Actions commit SHAs"
          delete-branch: true
