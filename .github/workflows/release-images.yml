name: Release images

# Builds the UI and BFF container images and the Helm chart for each published release and pushes them to GHCR.
# Trivy scans each image before the push and stops the release on fixable CRITICAL vulnerabilities.
# Images are arm64 only, matching the Hetzner CAX servers they are meant for.
# Every image and chart gets a signed SLSA build provenance attestation (Sigstore, GitHub attestations); the chart and
# its attestation bundle are also attached to the release, where OpenSSF Scorecard's Signed-Releases check finds them.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    permissions:
      contents: read
      packages: write
      security-events: write # uploads the Trivy results to code scanning
      id-token: write # signs the provenance with Sigstore
      attestations: write # stores the provenance as a GitHub attestation
    strategy:
      matrix:
        include:
          - name: ui
            context: ui
            file: ui/Dockerfile
          - name: bff
            context: .
            file: bff/Dockerfile
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/ftree-${{ matrix.name }}
          # A release gets its version (0.14.0) and a manual run its commit (sha-1c383f3); never `latest`.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha
      # Build into the local Docker daemon first, so an image is only pushed after Trivy has scanned it.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # All fixable findings go to code scanning; only fixable CRITICAL ones fail the release below.
      - name: Scan image for code scanning
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: image
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          ignore-unfixed: true
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.name)) != ''
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-image-${{ matrix.name }}
      - name: Fail on fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_DB_UPDATE: "true" # the scan above already downloaded it
        with:
          version: v0.75.0
          scan-type: image
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: "1"
      # Same builder and inputs as above, so this reuses the cached layers instead of building again.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # Verify with `gh attestation verify oci://ghcr.io/schillpeet/ftree-<name>:<version> -R schillpeet/ftree`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/ftree-${{ matrix.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Publishes the Helm chart with the release version as chart and app version, so it points at the images above.
  # Manual runs have no release version and skip it.
  chart:
    if: github.event_name == 'release'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write # attaches the chart and its provenance to the release
      packages: write # pushes the chart to GHCR
      id-token: write # signs the provenance with Sigstore
      attestations: write # stores the provenance as a GitHub attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Helm is preinstalled on GitHub-hosted Ubuntu runners.
      - env:
          TAG: ${{ github.event.release.tag_name }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          version="${TAG#v}"
          echo "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm package deploy/ftree --version "$version" --app-version "$version"
          helm push "ftree-$version.tgz" "oci://ghcr.io/$OWNER/charts"
      # Verify with `gh attestation verify ftree-<version>.tgz --bundle ftree-<version>.tgz.intoto.jsonl -R schillpeet/ftree`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: ftree-*.tgz
      # The bundle holds the in-toto SLSA provenance statement; Scorecard counts `*.intoto.jsonl` assets as provenance.
      - env:
          TAG: ${{ github.event.release.tag_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chart="ftree-${TAG#v}.tgz"
          cp "$BUNDLE" "$chart.intoto.jsonl"
          gh release upload "$TAG" "$chart" "$chart.intoto.jsonl" --clobber
