name: UI

# Runs only when files that affect the UI change; Markdown-only changes are skipped.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ui/**
      - api/openapi.yaml
      - .github/workflows/ui.yml
      - "!**.md"
  push:
    branches: [main]
    paths:
      - ui/**
      - api/openapi.yaml
      - .github/workflows/ui.yml
      - "!**.md"

permissions:
  contents: read

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Check generated API client is up to date
        run: |
          pnpm api:generate
          git diff --exit-code lib/api/generated
      - run: pnpm lint
      - run: pnpm typecheck
      - run: node app/familyLayout.check.mjs
      - run: pnpm build
