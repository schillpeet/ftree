name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 1. PR-Title Validation — IMMER (schnell, keine Deps)
  validate:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Validate conventional lowercase title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$PR_TITLE" =~ [[:upper:]] ]]; then
            echo "Pull request titles must be entirely lowercase."
            exit 1
          fi
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|chore|docs|refactor|test|build|ci)\((ui|bff|db|repo)\)!?:\ [a-z0-9] ]]; then
            echo "Use <type>(<scope>): <lowercase message>, for example: feat(ui): add family visibility toggle."
            exit 1
          fi

  # 2. UI Checks — nur bei UI-Änderungen
  ui:
    name: UI
    runs-on: ubuntu-latest
    if: ${{ contains(github.event.pull_request.changed_files, 'ui/') || contains(github.event.pull_request.changed_files, 'api/openapi.yaml') }}
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Check generated API client is up to date
        run: |
          pnpm api:generate
          git diff --exit-code lib/api/generated
      - run: pnpm lint
      - run: pnpm typecheck
      - run: node app/familyLayout.check.mjs
      - run: pnpm build

  # 3. BFF Checks — nur bei BFF-Änderungen
  bff:
    name: BFF
    runs-on: ubuntu-latest
    if: ${{ contains(github.event.pull_request.changed_files, 'bff/') || contains(github.event.pull_request.changed_files, 'api/openapi.yaml') }}
    defaults:
      run:
        working-directory: bff
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d appdb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/appdb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - run: ./gradlew build

  # 4. Pinact — nur bei Workflow-Änderungen (nicht required)
  pinact:
    name: Pinact
    runs-on: ubuntu-latest
    if: ${{ contains(github.event.pull_request.changed_files, '.github/workflows/') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      - run: npx actionlint -color -shellcheck='' .
      - uses: pinact/action@main