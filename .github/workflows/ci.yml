name: CI

# Always runs so `ci-ok` can be a required status check. The api, ui, and bff jobs run only when
# files that affect them change (Markdown-only changes are skipped); `ci-ok` waits for them.
# The image job also runs on release-please's release PR, so a release with fixable CRITICAL
# vulnerabilities in its images cannot be merged and never gets a tag.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read # paths-filter lists PR files via the API

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.api == 'true' }}
      ui: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.ui == 'true' }}
      bff: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.bff == 'true' }}
      image: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release-please--') || steps.filter.outputs.image == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          predicate-quantifier: every
          filters: |
            api:
              - "{api/**,.github/workflows/ci.yml}"
              - "!**/*.md"
            ui:
              - "{ui/**,api/openapi.yaml,.github/workflows/ci.yml}"
              - "!**/*.md"
            bff:
              - "{bff/**,api/openapi.yaml,.github/workflows/ci.yml}"
              - "!**/*.md"
            image:
              - "{bff/**,ui/**,api/openapi.yaml,.dockerignore,.github/workflows/ci.yml}"
              - "!**/*.md"

  # Lints the contract with Spectral and the OWASP ruleset and, on pull requests, fails on breaking changes against the
  # base branch unless the PR title marks one with `!`, so every breaking contract change shows up in the changelog.
  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the base branch's spec for oasdiff
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: api/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml
      - run: pnpm --dir api install --frozen-lockfile
      - run: pnpm --dir api lint
      - name: Fail on breaking changes
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.title, '!:')
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git show "origin/$BASE_REF:api/openapi.yaml" > "$RUNNER_TEMP/base.yaml"
          breaking() {
            docker run --rm -v "$RUNNER_TEMP:/base:ro" -v "$PWD/api:/revision:ro" \
              tufin/oasdiff:v1.34.1@sha256:67a23cfea7d251e2ae34ee703ac8733c5d96bc2e7b90fd0f4d475ec99367b85f \
              breaking /base/base.yaml /revision/openapi.yaml "$@"
          }
          # A new problem code is no breaking change: clients treat a code they do not know as a generic error. oasdiff
          # reports it once per error response and only ignores exact lines, so the lines are built from its own
          # findings. Only the `code` property of Problem is exempt; new values in any other enum still fail.
          breaking --format json \
            | jq -r '.[] | select(.id == "response-property-enum-value-added" and (.text | test("enum value to the `code` response property")))
                | "\(.operation) \(.path) \(.text)"' \
            > "$RUNNER_TEMP/err-ignore.txt"
          breaking --fail-on ERR --err-ignore /base/err-ignore.txt

  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Check generated API client is up to date
        run: |
          pnpm api:generate
          git diff --exit-code lib/api/generated
      - run: pnpm lint
      - run: pnpm typecheck
      - run: node app/familyLayout.check.mjs
      - run: node app/pins.check.mjs
      - run: node app/arrange.check.mjs
      - run: node app/generations.check.mjs
      - run: node app/cardTextures.check.mjs
      - run: node app/nameSearch.check.mjs
      - run: node app/names.check.mjs
      - run: node app/problems.check.mjs
      - run: node app/partnerships.check.mjs
      - run: node app/panelPosition.check.mjs
      - run: node app/simpleLayout.check.mjs
      - run: node app/access.check.mjs
      - run: node app/slugRoute.check.mjs
      - run: node app/conflict.check.mjs
      - run: node app/experimental/model.check.mjs
      - run: node app/experimental/route.check.mjs
      - run: node app/experimental/families.check.mjs
      - run: node app/experimental/highlight.check.mjs
      - run: pnpm build

  bff:
    needs: changes
    if: needs.changes.outputs.bff == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bff
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d appdb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/appdb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags for the git-derived version
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew build

  # Builds both images like release-images.yml (arm64, not pushed) and fails on the same Trivy gate,
  # before a release exists; release-images.yml scans again at release time as a last check.
  image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ui
            context: ui
            file: ui/Dockerfile
          - name: bff
            context: .
            file: bff/Dockerfile
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          load: true
          tags: ftree-${{ matrix.name }}:scan
      - name: Fail on fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: image
          image-ref: ftree-${{ matrix.name }}:scan
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: "1"

  # Required status check: passes when every job above succeeded or was skipped.
  ci-ok:
    needs: [changes, api, ui, bff, image]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
