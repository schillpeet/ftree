name: README preview

# Attaches a screenshot of the app to each release; the README embeds the latest one.
# Releases are published with RELEASE_PLEASE_TOKEN, so they trigger this workflow.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the preview to, for example v0.9.0
        required: true

permissions:
  contents: write # gh release upload

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # tags for the git-derived BFF version
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Start database, BFF, and production UI
        run: |
          mkdir -p .local
          docker compose up -d --wait db
          (cd bff && nohup ./gradlew --no-daemon bootRun > ../.local/bff.log 2>&1 &)
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui build
          nohup pnpm --dir ui start > .local/ui.log 2>&1 &
          for url in http://localhost:8080/families http://localhost:3000; do
            timeout 300 bash -c "until curl -sf $url > /dev/null; do sleep 2; done"
          done

      # The UI opens the "default" family first; replace the empty one with the demo family.
      - name: Import demo family
        run: |
          default_id=$(curl -sf http://localhost:8080/families | jq -r '.[] | select(.name == "default") | .id')
          jq -n --rawfile gedcom docs/preview/demo.ged '{name: "Smith", gedcom: $gedcom}' |
            curl -sf -X POST -H 'Content-Type: application/json' -d @- http://localhost:8080/families/import
          if [[ -n "$default_id" ]]; then curl -sf -X DELETE "http://localhost:8080/families/$default_id"; fi

      # The new headless mode ("chromium" channel) renders the WebGL scene with cards; the old shell stalls.
      - name: Take screenshot
        run: |
          npx -y playwright@1.64.0 install --with-deps chromium
          npx -y playwright@1.64.0 screenshot --channel chromium --viewport-size=1280,720 \
            --wait-for-timeout=15000 http://localhost:3000 preview.png

      - name: Attach screenshot to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" preview.png --clobber

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: logs
          path: .local/*.log
