# Heap sizes for the Gradle and Kotlin compiler daemons.
#
# Why this exists: without a gradle.properties, Gradle falls back to its default daemon
# heap of ~512 MB, and the Kotlin compiler daemon inherits that value. A plain
# `./gradlew build` just barely fits, but the CodeQL workflow runs the same build under
# the CodeQL tracer. The Kotlin extractor hooks into the compiler and keeps extra data
# in memory, so compileKotlin failed with
# "OutOfMemoryError: GC overhead limit exceeded" (reported at Main.kt:-1:-1, which only
# means "somewhere in the backend" - the source code itself is small and not the cause).
# The generated OpenAPI sources add to the compiler's workload as well.
#
# 3g leaves headroom on standard GitHub-hosted runners (7 GB RAM or more).
org.gradle.jvmargs=-Xmx3g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g
