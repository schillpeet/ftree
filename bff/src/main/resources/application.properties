spring.application.name=bff
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/appdb}
spring.datasource.username=${DB_USER:app}
spring.datasource.password=${DB_PASSWORD:app}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
# Databases created earlier by Hibernate already match V1, so Flyway records them as baselined instead of re-running V1.
spring.flyway.baseline-on-migrate=true
# PostgreSQL errors would otherwise quote row values such as names, which then end up in exceptions and logs.
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false

# Errors are RFC 9457 problem details (ProblemAdvice); Boot's fallback error page must not add internals either.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Health and metrics listen on their own port, which the UI's /api rewrite and the tunnel never route to.
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
# Readiness takes the pod out of the Service while PostgreSQL is unreachable; liveness leaves the database out, so that does not restart it.
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# JSON logs (Elastic Common Schema); log statements must not contain names, emails, or ids of people.
logging.structured.format.console=ecs

# The address people open the UI at; invitation texts link to <public-url>/<slug>.
app.public-url=${APP_PUBLIC_URL:http://localhost:3000}

# The Cloudflare Access group `ftree users`, which the BFF keeps equal to everyone with access (AccessSync); without
# all three values the BFF uses the noop gateway and syncs nothing.
app.cloudflare.api-token=${CLOUDFLARE_API_TOKEN:}
app.cloudflare.account-id=${CLOUDFLARE_ACCOUNT_ID:}
app.cloudflare.access-group-id=${CLOUDFLARE_ACCESS_GROUP_ID:}
# Dry run only logs the counts a sync would change; force allows removing more than max-removals or half the group at once.
app.access-sync.dry-run=${ACCESS_SYNC_DRY_RUN:false}
app.access-sync.force=${ACCESS_SYNC_FORCE:false}
app.access-sync.max-removals=${ACCESS_SYNC_MAX_REMOVALS:5}
app.access-sync.seat-limit=${ACCESS_SYNC_SEAT_LIMIT:50}
