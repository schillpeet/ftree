# Tests run in the default cloudflare mode, which refuses to start without these; CloudflareModeTest replaces the
# decoder so no request reaches Cloudflare.
app.auth.team-domain=test.cloudflareaccess.com
app.auth.audience=test-audience
# Test data piles up in the shared database across runs, so the seat limit stays out of the way; AccessSyncTest sets
# its own. The noop gateway keeps every test away from the real Cloudflare API, whatever the environment says.
app.access-sync.seat-limit=1000000
app.cloudflare.api-token=
